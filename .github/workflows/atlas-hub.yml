name: atlas-hub Release

on:
  push:
    branches: [atlas-hub]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when source and dependencies are unchanged
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: atlas-hub-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.inputs.outputs.needed }}
      commit: ${{ steps.inputs.outputs.commit }}
      version: ${{ steps.inputs.outputs.version }}
      tag: ${{ steps.inputs.outputs.tag }}
      inputs: ${{ steps.inputs.outputs.inputs }}
      profile: ${{ steps.inputs.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-hub
      - name: Check for source and dependency changes
        id: inputs
        uses: atlas-rust-servers/ilovepatatos-extension/.github/actions/branch-inputs@c0a329ae02dcc10d453c03125234ab85b6f0dca1
        with:
          profile: ''
          force: ${{ inputs.force || false }}

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUILD_TAG: ${{ needs.check.outputs.tag }}
      BUILD_INPUTS: ${{ needs.check.outputs.inputs }}
      RESOLVED_PROFILE: ${{ needs.check.outputs.profile }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Download references
        run: |
          $runtime = ($env:BUILD_INPUTS | ConvertFrom-Json).runtime
          ./Download-References.ps1 -Linux -RustManifest $runtime.rustManifest -OxideUrl $runtime.oxideUrl -OxideSha256 $runtime.oxideSha256

      - name: Build DLL
        run: dotnet build src/Rust.UIFramework/Rust.UIFramework.csproj -c Release /p:Platform=UiFramework /p:Version=$env:VERSION -f net48

      - name: Build unit tests
        run: dotnet build src/Rust.UiFramework.UnitTests/Rust.UiFramework.UnitTests.csproj -c Release '/p:Platform=Unit Tests' /p:Version=$env:VERSION

      - name: Run unit tests
        run: '& "src/Rust.UiFramework.UnitTests/bin/Unit Tests/Release/net9.0/Rust.UiFramework.UnitTests.exe" -culture en-US'

      - name: Package DLL and references
        run: |
          if (-not (Test-Path 'src/references/Rust/Facepunch.Steamworks.Posix.dll'))
          {
              throw 'Linux references are required for the atlas-hub release.'
          }
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $assetName = 'atlas-hub_Oxide.Ext.UiFramework.dll'
          Copy-Item 'src/Rust.UIFramework/bin/UiFramework/Release/net48/Oxide.Ext.UiFramework.dll' "bin/$assetName"
          $references = @(foreach ($file in Get-ChildItem 'src/references/Rust' -Filter '*.dll' -File | Sort-Object Name)
          {
              [ordered]@{
                  file = $file.Name
                  sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
          })
          if ($references.Count -eq 0)
          {
              throw 'No Rust/Oxide references found.'
          }
          Compress-Archive -Path 'src/references/Rust/*.dll' -DestinationPath 'bin/atlas-hub.references.zip'
          $manifest = [ordered]@{
              schema = 1
              repository = $env:GITHUB_REPOSITORY
              branch = 'atlas-hub'
              commit = (git rev-parse HEAD)
              tag = $env:BUILD_TAG
              version = $env:VERSION
              sdk = (dotnet --version)
              targetFramework = 'net48'
              asset = [ordered]@{
                  file = $assetName
                  sha256 = (Get-FileHash "bin/$assetName" -Algorithm SHA256).Hash.ToLowerInvariant()
              }
              buildInputs = $env:BUILD_INPUTS | ConvertFrom-Json
              references = [ordered]@{
                  platform = 'linux'
                  file = 'atlas-hub.references.zip'
                  sha256 = (Get-FileHash 'bin/atlas-hub.references.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
                  assemblies = $references
              }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content 'bin/atlas-hub.build.json' -Encoding utf8

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: atlas-hub-build
          path: bin/*
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atlas-hub-build
          path: bin
      - name: Publish complete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ needs.check.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          gh release create "$BUILD_TAG" bin/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --draft --prerelease --latest=false --title "$BUILD_TAG" --notes "Automatic atlas-hub build from $SOURCE_COMMIT. Exact dependencies and Rust/Oxide inputs are attached."
          gh release edit "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false