name: atlas-hub Rolling Build

on:
  push:
    branches: [ "atlas-hub" ]
  workflow_dispatch:

env:
  HUB_TAG: atlas-hub-latest
  ASSET_NAME: atlas-hub_Oxide.Ext.UiFramework.dll

jobs:
  build:

    runs-on: windows-latest

    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Checkout atlas-hub
        uses: actions/checkout@v4
        with:
          ref: atlas-hub
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Resolve version
        shell: pwsh
        run: |
          $latestTag = git tag -l --sort=-v:refname | Where-Object { $_ -match '^v?\d+\.\d+\.\d+$' } | Select-Object -First 1
          if (-not $latestTag) {
            $latestTag = "0.0.0"
          }
          echo "VERSION=$($latestTag.TrimStart('v'))-hub.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download References
        shell: pwsh
        run: |
          .\Download-References.ps1

      - name: Build DLL - Oxide (atlas-hub)
        run: dotnet build Rust.UIFramework.csproj -c Release /p:Platform=UiFramework /p:Version=${{ env.VERSION }} -f net48
        working-directory: src/Rust.UIFramework

      - name: Build Unit Tests
        run: dotnet build src/ -c Release /p:Platform="Unit Tests"

      - name: Run Unit Tests
        run: .\src\Rust.UiFramework.UnitTests\bin\"Unit Tests"\Release\net9.0\Rust.UiFramework.UnitTests.exe

      - name: Stage asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item "src/Rust.UIFramework/bin/UiFramework/Release/net48/Oxide.Ext.UiFramework.dll" "bin/${{ env.ASSET_NAME }}" -Force

      - name: Publish rolling pre-release
        shell: pwsh
        run: |
          gh release view $env:HUB_TAG -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:HUB_TAG --title "atlas-hub rolling build" --notes "bootstrap" --prerelease --target atlas-hub -R $env:GITHUB_REPOSITORY
          }
          gh release upload $env:HUB_TAG "bin/$env:ASSET_NAME" -R $env:GITHUB_REPOSITORY --clobber
          gh release edit $env:HUB_TAG --notes "Rolling build of the atlas-hub branch. Version $env:VERSION, commit $env:GITHUB_SHA, run #$env:GITHUB_RUN_NUMBER." -R $env:GITHUB_REPOSITORY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
