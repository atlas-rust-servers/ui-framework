name: Check atlas-hub updates

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force a branch rebuild
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: atlas-hub-launcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the atlas-hub branch
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: gh workflow run atlas-hub.yml --repo "$GITHUB_REPOSITORY" --ref atlas-hub -f force="$FORCE"