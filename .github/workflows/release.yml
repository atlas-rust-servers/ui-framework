name: Create Release

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: true
        description: Publish after a successful build

permissions:
  contents: write

concurrency:
  group: ui-main-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Resolve-ReleaseVersion.ps1
      - name: Download current references
        run: ./Download-References.ps1
      - name: Build Oxide
        run: dotnet build src/Rust.UIFramework/Rust.UIFramework.csproj -c Release /p:Platform=Oxide /p:Version=$env:VERSION -f net48
      - name: Build Carbon
        run: dotnet build src/Rust.UIFramework/Rust.UIFramework.csproj -c Release /p:Platform=Carbon /p:Version=$env:VERSION -f net48
      - name: Package release
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          Copy-Item src/Rust.UIFramework/bin/Oxide/Release/net48/Oxide.Ext.UiFramework.dll bin/
          Copy-Item src/Rust.UIFramework/bin/Carbon/Release/net48/Carbon.Ext.UiFramework.dll bin/
          [ordered]@{
              repository = $env:GITHUB_REPOSITORY
              branch = 'main'
              commit = (git rev-parse HEAD)
              tag = $env:RELEASE_TAG
              version = $env:VERSION
              asset = @{ file = 'Oxide.Ext.UiFramework.dll' }
          } | ConvertTo-Json -Depth 4 | Set-Content bin/main.build.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ui-main-build
          path: bin/*
          if-no-files-found: error
      - name: Publish release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem bin -File | Select-Object -ExpandProperty FullName)
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --latest --title $env:RELEASE_TAG --notes 'UiFramework main build with current game references.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
