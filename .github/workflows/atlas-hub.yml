name: atlas-hub Release

on:
  push:
    branches: [atlas-hub]
  workflow_dispatch:
  pull_request:
    branches: [ "atlas-hub" ]

permissions:
  contents: read

concurrency:
  group: ui-atlas-hub-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Checkout source commit
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Resolve version
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Resolve-ReleaseVersion.ps1 -Prefix 'atlas-hub-'

      - name: Download references
        run: ./Download-References.ps1 -Linux

      - name: Build DLL
        run: dotnet build src/Rust.UIFramework/Rust.UIFramework.csproj -c Release /p:Platform=UiFramework /p:Version=$env:VERSION -f net48

      - name: Build unit tests
        run: dotnet build src/Rust.UiFramework.UnitTests/Rust.UiFramework.UnitTests.csproj -c Release '/p:Platform=Unit Tests' /p:Version=$env:VERSION

      - name: Run unit tests
        run: '& "src/Rust.UiFramework.UnitTests/bin/Unit Tests/Release/net9.0/Rust.UiFramework.UnitTests.exe" -culture en-US'

      - name: Package DLL and references
        run: |
          if (-not (Test-Path 'src/references/Rust/Facepunch.Steamworks.Posix.dll'))
          {
              throw 'Linux references are required for the atlas-hub release.'
          }
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $assetName = 'atlas-hub_Oxide.Ext.UiFramework.dll'
          Copy-Item 'src/Rust.UIFramework/bin/UiFramework/Release/net48/Oxide.Ext.UiFramework.dll' "bin/$assetName"
          $manifest = [ordered]@{
              schema = 1
              repository = $env:GITHUB_REPOSITORY
              branch = 'atlas-hub'
              commit = (git rev-parse HEAD)
              tag = $env:RELEASE_TAG
              version = $env:VERSION
              sdk = (dotnet --version)
              targetFramework = 'net48'
              asset = [ordered]@{
                  file = $assetName
              }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content 'bin/atlas-hub.build.json' -Encoding utf8

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: atlas-hub-build
          path: bin/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: atlas-hub-build
          path: bin

      - name: Publish versioned prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifest = Get-Content bin/atlas-hub.build.json -Raw | ConvertFrom-Json
          $assets = @(Get-ChildItem bin -File | Select-Object -ExpandProperty FullName)
          gh release create $manifest.tag @assets --repo $env:GITHUB_REPOSITORY --target $manifest.commit --prerelease --latest=false --title $manifest.tag --notes 'UiFramework atlas-hub build with current Linux Rust/Oxide references.'
          if ($LASTEXITCODE -ne 0) { throw 'Prerelease publication failed.' }
